<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete String & Number Methods in JavaScript</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <h1>💻 Complete String & Number Methods</h1>

    <div class="main-container">

        <!-- STRING METHODS SECTION -->
        <div class="section string-section">
            <div id="menu">
            <a href="index1.html">📝 Simple Notepad</a> <a href="number.html">📊 Simple Calculator</a>
           </div>

            <div class="methods-grid">
                <button class="method-btn" onclick="str_length()">length</button>
                <button class="method-btn" onclick="str_charAt()">charAt()</button>
                <button class="method-btn" onclick="str_charCodeAt()">charCodeAt()</button>
                <button class="method-btn" onclick="str_concat()">concat()</button>
                <button class="method-btn" onclick="str_endsWith()">endsWith()</button>
                <button class="method-btn" onclick="str_includes()">includes()</button>
                <button class="method-btn" onclick="str_indexOf()">indexOf()</button>
                <button class="method-btn" onclick="str_lastIndexOf()">lastIndexOf()</button>
                <button class="method-btn" onclick="str_match()">match()</button>
                <button class="method-btn" onclick="str_repeat()">repeat()</button>
                <button class="method-btn" onclick="str_replace()">replace()</button>
                <button class="method-btn" onclick="str_search()">search()</button>
                <button class="method-btn" onclick="str_slice()">slice()</button>
                <button class="method-btn" onclick="str_split()">split()</button>
                <button class="method-btn" onclick="str_startsWith()">startsWith()</button>
                <button class="method-btn" onclick="str_toLowerCase()">toLowerCase()</button>
                <button class="method-btn" onclick="str_toUpperCase()">toUpperCase()</button>
                <button class="method-btn" onclick="str_trim()">trim()</button>
                <button class="method-btn" onclick="str_at()">at()</button>
                <button class="method-btn" onclick="str_replaceAll()">replaceAll()</button>
            </div>
            <div id="main">
            <div id="main_input">    
            <label>Enter Text:</label>
            <textarea id="strInput">Hello World! JavaScript is Amazing!</textarea>

            <label>Search Word:</label>
            <input type="text" id="strSearch" value="World">

            <label>Replace With:</label>
            <input type="text" id="strReplace" value="Pakistan">
</div>
        

            <div class="result-box">
                <h4>📤 RESULT:</h4>
                <div class="output" id="strOutput">Click any button to see the result...</div>
                <h4>📤 What Method do:</h4>
                <div class="outputmesage" id="strmessage">Click any button to see whats Method do</div>
            </div>
        </div>
        </div>



    </div>

   <script src="script1.js"></script>

</body>
</html>
